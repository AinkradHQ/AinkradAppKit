name: CI

# AinkradAppKit is the ABI contract every plugin in the family binds to, and
# until now it had no .github directory at all — `make abi-check` ran only when
# someone remembered, which is how its baseline drifted four commits behind
# without anyone noticing.
#
# This workflow is NOT dormant: Build and Test run fine on macos-latest, which
# lacks Xcode-beta — the package doesn't need it for those steps.
#
# The ABI check is different, and on a hosted runner it CANNOT run honestly.
# swift-api-digester reads the binary .swiftmodule that `swift build` just
# produced, and a binary swiftmodule is only readable by the exact compiler
# build that wrote it. Under a foreign toolchain the digester fails to load the
# module and then — without aborting — diffs an empty module against the
# committed baseline, reporting every type in the contract as removed. That is
# a false break, not a check. (Seen here as `Failed to load module:
# AinkradAppKitContract` followed by 39 bogus removals.) Note it is a toolchain
# constraint, not an SDK one: the beta digester against the CommandLineTools
# SDK passes fine; the CLT digester against a beta-built module does not.
#
# So the Makefile gates the check on Xcode-beta and, when it is absent, SKIPS
# IT LOUDLY: a banner plus a ::warning:: annotation on the run saying the ABI
# contract was NOT verified. Green here therefore means "build + tests passed;
# ABI unverified", never "ABI verified". The contract is verified for real by
# scripts/preflight.sh in the host repo (invoked by scripts/release.sh) on a
# machine that has the beta toolchain, so no release ships unguarded.
#
# Why the check exists at all: an added protocol requirement is the one ABI
# break library evolution does NOT cover — an already-installed plugin has no
# witness for it and fails to load. Nothing in a normal build catches that.

on:
  push:
    branches: [master, main, development]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: |
          if [[ -d /Applications/Xcode-beta.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: ./scripts/design-lint.sh --self-test && ./scripts/design-lint.sh --check

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # Runs for real only on a runner that has Xcode-beta (the toolchain that
      # builds this package and generated abi/AinkradAppKitContract.abi.json).
      # Anywhere else it prints a loud SKIPPED banner and a ::warning::
      # annotation — see the header comment. It never reports a pass for a
      # check that did not run.
      - name: ABI check (skipped loudly without the beta toolchain)
        run: make abi-check

      - name: Upload ABI report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abi-report
          path: abi/report.txt
